<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso Sistema OCR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark d-flex align-items-center" style="height: 100vh;">
<div class="container card p-4" style="max-width: 400px;">
    <div class="text-center mb-3">
        <img src="/logo.png" alt="IdentiScan Logo" style="max-height: 80px;" class="img-fluid rounded">
    </div>
    <h2 class="text-center fw-bold">IdentiScan</h2>
    <p class="text-muted text-center">Acceso al Sistema</p>

    <form action="/login" method="POST">
        <input type="text" name="username" class="form-control mb-3" placeholder="Usuario" required>
        <input type="password" name="password" class="form-control mb-3" placeholder="Contraseña" required>
        <button type="submit" class="btn btn-primary w-100">Iniciar Sesión</button>
    </form>

    <!-- Mensaje opcional por si fallan los datos -->
    <div id="error-msg" class="text-danger text-center mt-2" style="display:none;">
        Credenciales incorrectas
    </div>
</div>

<script>
    if(window.location.search.includes("error=true")) {
        document.getElementById("error-msg").style.display = "block";
    }
</script>
</body>
</html>
